<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AI HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #080c14;
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  background: #0d1424;
  border: 1px solid #1a2540;
  border-radius: 20px;
  padding: 44px 40px;
  box-shadow: 0 0 60px rgba(0,229,255,.06);
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 32px;
  text-decoration: none;
}

.logo-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #00e5ff;
  box-shadow: 0 0 10px #00e5ff;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #e2e8f0;
}

.card h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
  text-align: center;
}

.card .subtitle {
  text-align: center;
  font-size: 14px;
  color: #64748b;
  margin-bottom: 32px;
}

#error-banner {
  display: none;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5;
  font-size: 13px;
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 20px;
  text-align: center;
}

.input-group { margin-bottom: 18px; }

.input-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #94a3b8;
  margin-bottom: 7px;
}

.input-wrap { position: relative; }

.input-wrap input {
  width: 100%;
  padding: 12px 16px;
  padding-right: 44px;
  background: #0a1020;
  border: 1px solid #1a2540;
  border-radius: 10px;
  color: #e2e8f0;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

.input-wrap input::placeholder { color: #334155; }

.input-wrap input:focus {
  border-color: #00e5ff;
  box-shadow: 0 0 0 3px rgba(0,229,255,.1);
}

.input-wrap input.error { border-color: rgba(239,68,68,.6); }

.toggle-pw {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #475569;
  font-size: 16px;
  padding: 4px;
  line-height: 1;
  transition: color .2s;
  width: auto;
}

.toggle-pw:hover { color: #00e5ff; }

.field-error {
  font-size: 12px;
  color: #f87171;
  margin-top: 5px;
  display: none;
}

.forgot {
  display: flex;
  justify-content: flex-end;
  margin-top: -10px;
  margin-bottom: 18px;
}

.forgot a {
  font-size: 12px;
  color: #00e5ff;
  text-decoration: none;
  transition: opacity .2s;
}

.forgot a:hover { opacity: .7; }

.btn-login {
  width: 100%;
  padding: 13px;
  background: #00e5ff;
  color: #051015;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  letter-spacing: .2px;
  transition: background .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 0 24px rgba(0,229,255,.2);
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-login:hover {
  background: #00ccdd;
  transform: translateY(-1px);
  box-shadow: 0 0 36px rgba(0,229,255,.35);
}

.btn-login:active { transform: scale(.98); }

.btn-login:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(0,0,0,.3);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}

@keyframes spin { to { transform: rotate(360deg); } }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
}

.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #1a2540;
}

.divider span { font-size: 12px; color: #475569; }

.links {
  text-align: center;
  font-size: 14px;
  color: #64748b;
}

.links a {
  color: #00e5ff;
  text-decoration: none;
  font-weight: 500;
  transition: opacity .2s;
}

.links a:hover { opacity: .7; }

.back-link {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

.back-link a {
  font-size: 13px;
  color: #475569;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color .2s;
}

.back-link a:hover { color: #94a3b8; }

.rate-notice {
  text-align: center;
  font-size: 11px;
  color: #334155;
  margin-top: 20px;
}

@media (max-width: 480px) {
  .card { padding: 32px 24px; }
}

</style>
</head>
<body>

<div class="card">

  <a href="index.html" class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">AI HUB</span>
  </a>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your AI HUB account</p>

  <div id="error-banner"></div>

  <form id="login-form" novalidate>

    <div class="input-group">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required />
      </div>
      <div class="field-error" id="email-error">Enter a valid email address.</div>
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
          minlength="8" />
        <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">👁</button>
      </div>
      <div class="field-error" id="password-error">Password must be at least 8 characters.</div>
    </div>

    <div class="forgot">
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login" id="login-btn">
      <span id="btn-text">Sign in</span>
      <div class="spinner" id="spinner"></div>
    </button>

  </form>

  <div class="divider"><span>or</span></div>

  <div class="links">
    <p>Don't have an account? <a href="signup.html">Create one free</a></p>
  </div>

  <div class="back-link">
    <a href="index.html">← Back to home</a>
  </div>

  <p class="rate-notice">🔒 Your connection is secure. We never store plain-text passwords.</p>

</div>

<script src="js/login.js"></script>

</body>
</html>
