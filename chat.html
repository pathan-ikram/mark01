<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HUB Chat</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
 
body {
  background: #080c14;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
 
.chat-container {
  width: 100%;
  max-width: 760px;
  height: 90vh;
  max-height: 820px;
  background: #0d1424;
  border: 1px solid #1a2540;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
 
/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 24px;
  background: #0f1929;
  border-bottom: 1px solid #1a2540;
}
 
.header-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #00e5ff;
  box-shadow: 0 0 8px #00e5ff;
  animation: pulse 2s ease-in-out infinite;
}
 
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
 
.header-title {
  font-size: 16px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.3px;
}
 
.header-subtitle {
  margin-left: auto;
  font-size: 12px;
  color: #64748b;
  display: flex;
  align-items: center;
  gap: 6px;
}
 
.online-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #22c55e;
}
 
/* Messages */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
 
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: #1a2540; border-radius: 4px; }
 
/* Bubbles */
.user-message,
.bot-message {
  display: flex;
  flex-direction: column;
  max-width: 75%;
  gap: 4px;
}
 
.user-message {
  align-self: flex-end;
  align-items: flex-end;
}
 
.bot-message {
  align-self: flex-start;
  align-items: flex-start;
}
 
.message-text {
  padding: 11px 16px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
 
.user-message .message-text {
  background: #00e5ff;
  color: #051015;
  border-bottom-right-radius: 4px;
  font-weight: 500;
}
 
.bot-message .message-text {
  background: #131f35;
  color: #e2e8f0;
  border: 1px solid #1a2540;
  border-bottom-left-radius: 4px;
}
 
.message-time {
  font-size: 11px;
  color: #475569;
  padding: 0 4px;
}
 
/* Typing dots */
.typing-indicator .message-text {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 58px;
}
 
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #475569;
  animation: bounce 1.2s infinite ease-in-out;
}
 
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
 
@keyframes bounce {
  0%,80%,100% { transform:translateY(0); opacity:.4; }
  40%          { transform:translateY(-5px); opacity:1; }
}
 
/* Input area */
.input-area {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  background: #0f1929;
  border-top: 1px solid #1a2540;
}
 
#message {
  flex: 1;
  padding: 11px 16px;
  background: #0d1424;
  border: 1px solid #1a2540;
  border-radius: 10px;
  color: #e2e8f0;
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
 
#message::placeholder { color: #475569; }
 
#message:focus {
  border-color: #00e5ff;
  box-shadow: 0 0 0 3px rgba(0,229,255,.1);
}
 
#message:disabled { opacity: .5; cursor: not-allowed; }
 
.send-btn {
  padding: 11px 22px;
  background: #00e5ff;
  color: #051015;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, transform .15s;
  white-space: nowrap;
}
 
.send-btn:hover  { background: #00ccdd; transform: translateY(-1px); }
.send-btn:active { transform: scale(.97); }
.send-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
 
/* Footer */
.footer {
  text-align: center;
  padding: 10px;
  font-size: 11px;
  color: #2d3f5a;
  border-top: 1px solid #111d2e;
}
 
/* Welcome message */
.welcome {
  align-self: center;
  text-align: center;
  padding: 28px 24px;
  color: #475569;
  font-size: 14px;
  max-width: 360px;
}
 
.welcome-icon {
  font-size: 36px;
  margin-bottom: 12px;
}
 
.welcome h3 {
  color: #94a3b8;
  font-size: 16px;
  margin-bottom: 8px;
  font-weight: 600;
}
 
/* Responsive */
@media (max-width: 500px) {
  body { padding: 0; }
  .chat-container { height: 100vh; border-radius: 0; border: none; }
  .user-message, .bot-message { max-width: 88%; }
}
</style>
</head>
<body>
 
<div class="chat-container">
 
  <!-- Header -->
  <div class="header">
    <div class="header-dot"></div>
    <span class="header-title">AI HUB Assistant</span>
    <div class="header-subtitle">
      <div class="online-dot"></div> Online
    </div>
  </div>
 
  <!-- Messages -->
  <div id="messages">
    <div class="welcome">
      <div class="welcome-icon">🤖</div>
      <h3>Welcome to AI HUB</h3>
      <p>Ask me anything — I'm powered by Claude and ready to help with coding, writing, ideas, or just a chat.</p>
    </div>
  </div>
 
  <!-- Input -->
  <div class="input-area">
    <input type="text" id="message" placeholder="Ask anything…" autocomplete="off" />
    <button class="send-btn" onclick="sendMessage()">Send ➤</button>
  </div>
 
  <!-- Footer -->
  <div class="footer">© 2026 AI HUB | All Rights Reserved</div>
 
</div>
 
<script src="js/chat.js"></script>
</body>
</html>
