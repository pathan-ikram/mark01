<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI HUB Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
background:#111827;
color:white;
}

/* Sidebar */

.sidebar{

width:250px;
height:100vh;
background:#1f2937;
padding:20px;
position:fixed;

}

.sidebar h2{

text-align:center;
color:#00ffff;
margin-bottom:30px;

}

.sidebar ul{

list-style:none;

}

.sidebar ul li{

margin:18px 0;

}

.sidebar ul li a{

color:white;
text-decoration:none;
font-size:18px;

}

.sidebar ul li a:hover{

color:#00ffff;

}

/* Main */

.main{

margin-left:250px;
width:100%;
padding:30px;

}

/* Header */

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}

.header h1{

color:#00ffff;

}

.profile{

background:#1f2937;
padding:10px 20px;
border-radius:8px;

}

/* Cards */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}

.card{

background:#1f2937;
padding:25px;
border-radius:10px;
transition:0.3s;

}

.card:hover{

transform:translateY(-8px);

}

.card h2{

color:#00ffff;
margin-bottom:10px;

}

/* AI Prompt */

.prompt{

margin-top:40px;
background:#1f2937;
padding:25px;
border-radius:10px;

}

.prompt textarea{

width:100%;
height:140px;
padding:15px;
border:none;
border-radius:8px;
margin-top:15px;
resize:none;

}

.prompt button{

margin-top:15px;
padding:12px 25px;
background:#00ffff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

/* Recent Activity */

.activity{

margin-top:40px;
background:#1f2937;
padding:25px;
border-radius:10px;

}

.activity ul{

margin-top:15px;

}

.activity li{

margin-bottom:10px;

}

/* Profile */

.user{

margin-top:40px;
background:#1f2937;
padding:25px;
border-radius:10px;

}

.user h3{

color:#00ffff;
margin-bottom:10px;

}

/* Mobile */

@media(max-width:768px){

.sidebar{

position:relative;
width:100%;
height:auto;

}

.main{

margin-left:0;

}

body{

flex-direction:column;

}

}

</style>

</head>
